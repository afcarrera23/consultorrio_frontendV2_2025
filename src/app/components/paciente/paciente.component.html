<div class="form-container">
  <h2>Datos Personales</h2>
  <form #pacienteForm="ngForm">
    <p class="form-note">Los campos marcados con asterisco (*) son obligatorios</p>

    <!-- Fila 1: Tipo de identificación + checkbox -->
    <div class="form-row">
      <div class="form-group">
        <label for="tipoIdentificacion">Tipo de identificación *:</label>
        <select id="tipoIdentificacion" name="tipoIdentificacion"
                [(ngModel)]="paciente.tipoIdentificacion" required>
          <option value="">Seleccione</option>
          <option value="CC">Cédula de ciudadanía</option>
          <option value="TI">Tarjeta de identidad</option>
          <option value="CE">Cédula de extranjero</option>
          <option value="NA">No aplica</option>
        </select>
      </div>

      <div class="form-group form-group--checkbox">
        <label>
          <input type="checkbox"
                 [(ngModel)]="paciente.pendienteDocumento"
                 name="pendienteDocumento">
          No conoce el número ahora
        </label>
      </div>
    </div>

    <!-- Identificación -->
    <div class="form-row">
      <div class="form-group" style="flex: 1 1 100%;">
        <label for="identificacion">
          Número de identificación <span *ngIf="!paciente.pendienteDocumento">*</span>:
        </label>
        <input type="text"
               id="identificacion"
               name="identificacion"
               [(ngModel)]="paciente.identificacion"
               [required]="!paciente.pendienteDocumento"
               identUnica
               [identUnicaDisabled]="!!paciente.pendienteDocumento"
               [disabled]="!!paciente.pendienteDocumento"
               [ngModelOptions]="{ updateOn: 'blur' }"
               #identField="ngModel" />

        <small class="error" *ngIf="identField?.errors?.['duplicado']">
          Ya existe un paciente con esta identificación.
        </small>
        <small class="hint" *ngIf="identField?.pending">
          Validando identificación…
        </small>
        <small class="hint" *ngIf="paciente.pendienteDocumento">
          Se asignará un identificador temporal automático y podrás actualizarlo después.
        </small>
      </div>
    </div>

    <!-- Fila 2: Fecha de nacimiento y edad -->
    <div class="form-row">
      <div class="form-group">
        <label for="fechaNacimiento">Fecha de nacimiento *:</label>
        <input type="date"
               id="fechaNacimiento"
               name="fechaNacimiento"
               [(ngModel)]="paciente.fechaNacimiento"
               (change)="onFechaChange()"
               [max]="todayISO"
               required>
      </div>

      <div class="form-group">
        <label for="edad">Edad (auto):</label>
        <input type="number" id="edad" name="edad"
               [value]="edadCalculada ?? ''"
               disabled>
      </div>
    </div>

    <!-- Fila 3: Nombre y apellidos -->
    <div class="form-row">
      <div class="form-group">
        <label for="nombreCompleto">Nombre completo *:</label>
        <input type="text" id="nombreCompleto" name="nombreCompleto"
               [(ngModel)]="paciente.nombreCompleto" required>
      </div>

      <div class="form-group">
        <label for="apellidoCompleto">Apellidos *:</label>
        <input type="text" id="apellidoCompleto" name="apellidoCompleto"
               [(ngModel)]="paciente.apellidoCompleto" required>
      </div>
    </div>

    <!-- Fila 4: Sexo y profesión -->
    <div class="form-row">
      <div class="form-group">
        <label for="genero">Sexo *:</label>
        <select id="genero" name="genero" [(ngModel)]="paciente.genero" required>
          <option value="">Seleccione</option>
          <option value="Masculino">Masculino</option>
          <option value="Femenino">Femenino</option>
          <option value="Otro">Otro</option>
        </select>
      </div>

      <div class="form-group">
        <label for="profesion">Profesión / ocupación:</label>
        <input type="text" id="profesion" name="profesion"
               [(ngModel)]="paciente.profesion">
      </div>
    </div>

    <!-- Fila 5: Teléfono y dirección -->
    <div class="form-row">
      <div class="form-group">
        <label for="numeroTelefono">Teléfono *:</label>
        <input type="text" id="numeroTelefono" name="numeroTelefono"
               [(ngModel)]="paciente.numeroTelefono" required>
      </div>

      <div class="form-group">
        <label for="direccion">Dirección:</label>
        <input type="text" id="direccion" name="direccion"
               [(ngModel)]="paciente.direccion">
      </div>
    </div>

    <!-- Fila 6: Acompañante y correo -->
    <div class="form-row">
      <div class="form-group">
        <label for="nombreAcompanante">Nombre del acompañante:</label>
        <input type="text" id="nombreAcompanante" name="nombreAcompanante"
               [(ngModel)]="paciente.nombreAcompanante">
      </div>

      <div class="form-group">
        <label for="correo">Correo electrónico:</label>
        <input type="email" id="correo" name="correo"
               [(ngModel)]="paciente.correo">
      </div>
    </div>

    <input type="hidden" [(ngModel)]="paciente.usuarioRegistroId" name="usuarioRegistroId">

    <!-- Acciones -->
    <div class="form-row form-actions">
      <button type="button" 
              class="btn btn-primary"
              (click)="siguientePanelAntecedentes()"
              [disabled]="!pacienteForm.form.valid 
                          || (!paciente.pendienteDocumento && (identField?.pending || identField?.errors?.['duplicado']))
                          || isSubmitting">
        {{ paciente.id ? 'Continuar' : 'Siguiente' }}
      </button>
    </div>

    <div class="form-row form-cancel">
      <button type="button" class="btn-cancel" (click)="abrirPopupCancelar()">
        Cancelar
      </button>
    </div>
  </form>
</div>

<app-popup
  *ngIf="isPopupOpen"
  [message]="'¿Deseas abandonar el registro?'"
  [confirmText]="'SI'"
  [cancelText]="'NO'"
  (onConfirm)="confirmarSalida()"
  (onCancel)="cerrarPopup()">
</app-popup>
