<div class="container">
  <!-- ===== Buscador ===== -->
  <div class="search-box">
    <div class="form-group">
      <label for="search" class="search-label">Buscar paciente:</label>
    </div>

    <div class="form-row">
      <div class="search-input">
        <input
          type="text"
          id="search"
          name="search"
          placeholder="Número de identificación o nombre del paciente"
          [(ngModel)]="searchQuery"
          (input)="buscarPaciente()"
          (keyup.enter)="buscarPaciente()"
        />
        <!-- Limpiar -->
        <button
          *ngIf="searchQuery"
          type="button"
          class="clear"
          (click)="searchQuery=''; buscarPaciente()"
          aria-label="Limpiar búsqueda"
          title="Limpiar"
        >
          ×
        </button>
      </div>

      <div class="button-group">
        <button class="btn-secondary" (click)="agregarPaciente()">Agregar paciente</button>

            <!-- Nuevo botón -->
        <button class="btn-formula" (click)="nuevaFormula()">
          Fórmula rapida
        </button>
      </div>
    </div>
  </div>

  <!-- ===== Lista ===== -->
  <div class="patient-list">
    <h3>Lista de Pacientes</h3>

    <div *ngIf="!pacientesFiltrados?.length" class="empty-result">
      No hay resultados para “{{ searchQuery || '' }}”.
    </div>

    <table *ngIf="pacientesFiltrados?.length">
      <thead>
        <tr>
          <th>Apellido</th>
          <th>Nombre</th>
          <th>Identificación</th>
          <th style="width: 220px;">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let paciente of pacientesFiltrados">
          <td>{{ paciente.apellidoCompleto }}</td>
          <td>{{ paciente.nombreCompleto }}</td>
          <td>{{ paciente.identificacion }}</td>
          <td>
            <button class="btn-icon" (click)="editarPaciente(paciente)" title="Editar">
              <img src="assets/imagenes/editar.png" alt="Editar" class="icono-editar">
            </button>
            <button class="btn-icon" (click)="verHistorias(paciente)" title="Ver historial">
              <img src="assets/imagenes/ver.png" alt="Ver" class="icono-ver">
            </button>
            <button
              class="btn-icon"
              (click)="imprimirReceta(paciente)"
              [disabled]="loadingImprimirId===paciente.id"
              title="Imprimir receta">
              <img src="assets/imagenes/imprimir.png" alt="Imprimir" class="icono-ver">
            </button>
            <!-- Botón de eliminar abre modal -->
            <button class="btn-icon" (click)="abrirConfirmarEliminar(paciente)" title="Eliminar">
              <img src="assets/imagenes/eliminar.png" alt="Eliminar" class="icono-ver">
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Modal de confirmación de eliminación -->
<ng-container *ngIf="confirmDelete.visible">
  <app-popup
    [message]="'¿Eliminar definitivamente al paciente ' 
                + (confirmDelete.paciente?.nombreCompleto || '') + ' ' 
                + (confirmDelete.paciente?.apellidoCompleto || '') 
                + ' (' + (confirmDelete.paciente?.identificacion || '') + ')?'"
    [confirmText]="confirmDelete.loading ? 'Eliminando…' : 'Sí, eliminar'"
    [cancelText]="'Cancelar'"
    (onConfirm)="confirmarEliminar()"
    (onCancel)="cancelarEliminar()">
  </app-popup>

  <div *ngIf="confirmDelete.error" class="popup-error">
    {{ confirmDelete.error }}
  </div>
</ng-container>
